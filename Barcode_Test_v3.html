<!-- 🔥 변경된 핵심만 표시 (전체 그대로 복붙 가능) -->
<script>
  // ── 추가된 전역 상태 ──
  let scanLock = false;        // 0.5초 잠금
  let lastScannedValue = null; // 중복 방지

  // 🔊 사운드 생성 함수 (외부 파일 없이 사용)
  function playBeep(type) {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();

    osc.connect(gain);
    gain.connect(ctx.destination);

    // QR / 바코드 소리 구분
    if (type === 'qr') {
      osc.frequency.value = 1200;
    } else {
      osc.frequency.value = 800;
    }

    osc.type = 'sine';
    gain.gain.value = 0.1;

    osc.start();
    setTimeout(() => {
      osc.stop();
      ctx.close();
    }, 100);
  }

  // 📳 진동 패턴
  function vibrateByType(type) {
    if (!navigator.vibrate) return;

    if (type === 'qr') {
      navigator.vibrate([100, 50, 100]); // QR: 두번
    } else {
      navigator.vibrate(120); // 바코드: 한번
    }
  }

  // ─────────────────────────────
  // 🔥 완전 강화된 onDetected
  // ─────────────────────────────
  function onDetected(value, type) {

    // ❌ 0.5초 잠금
    if (scanLock) return;

    // ❌ 동일 코드 반복 방지
    if (value === lastScannedValue) return;

    scanLock = true;
    lastScannedValue = value;

    setTimeout(() => {
      scanLock = false;
    }, 500);

    const isQr = type === 'qr';

    // UI 업데이트
    document.getElementById('detectedBox').className =
      'detected-box ' + (isQr ? 'hl-qr' : 'hl-barcode');

    document.getElementById('detectedLabel').className =
      'detected-label ' + (isQr ? 'lbl-qr' : 'lbl-barcode');

    const pill = document.getElementById('typePill');
    pill.className = 'type-pill ' + (isQr ? 'pill-qr' : 'pill-barcode');
    pill.textContent = isQr ? 'QR CODE' : 'BARCODE';

    const val = document.getElementById('detectedVal');
    val.textContent = value;
    val.classList.remove('empty');

    // 🔊 사운드 + 📳 진동
    playBeep(type);
    vibrateByType(type);

    showToast(isQr ? '▦ QR코드 감지!' : '■ 바코드 감지!', isQr ? 'qr' : 'barcode');

    lastDetected = { value, type };

    // 🔥 자동 저장
    autoSaveToSlot();
  }

  // ─────────────────────────────
  // 🔥 자동 저장 로직
  // ─────────────────────────────
  function autoSaveToSlot() {
    if (!lastDetected) return;

    currentSlots[selectedSlot] = { ...lastDetected };

    showToast(`슬롯 ${selectedSlot + 1} 자동 저장`, 'neutral');

    const nextEmpty = currentSlots.findIndex(s => s === null);

    if (nextEmpty !== -1) {
      selectedSlot = nextEmpty;
    } else {
      // 슬롯 다 찼으면 자동 저장
      confirmItem();
      showToast('자동으로 목록에 추가됨', 'neutral');
    }

    lastDetected = null;

    document.getElementById('detectedVal').textContent = '다음 코드 스캔 중...';
    document.getElementById('detectedVal').classList.add('empty');
    document.getElementById('detectedBox').className = 'detected-box';

    renderSlotBtns();
    renderPreview();
  }
</script>
