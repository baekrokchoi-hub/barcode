<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Smart Scanner Pro</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/quagga/0.12.1/quagga.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=Noto+Sans+KR:wght@300;400;700&display=swap');

    :root {
      --bg: #0d0f14; --surface: #161a22; --card: #1e2430; --border: #2a3040;
      --accent: #00e5a0; --accent2: #0077ff; --qr-color: #a78bfa;
      --warn: #ff4d6d; --text: #e8eaf0; --muted: #6b7590;
      --mono: 'IBM Plex Mono', monospace; --sans: 'Noto Sans KR', sans-serif;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg); color: var(--text); font-family: var(--sans);
      min-height: 100vh; display: flex; flex-direction: column; overflow-x: hidden;
    }

    .header {
      padding: 15px 20px 12px; border-bottom: 1px solid var(--border);
      display: flex; align-items: center; gap: 12px; background: var(--surface);
    }
    .header-icon {
      width: 36px; height: 36px; flex-shrink: 0;
      background: linear-gradient(135deg, var(--accent), var(--qr-color));
      border-radius: 8px; display: flex; align-items: center; justify-content: center;
    }
    .header h1 { font-size: 17px; font-weight: 700; }
    .header-sub { font-size: 10px; color: var(--muted); font-family: var(--mono); margin-left: auto; }

    .tabs { display: flex; background: var(--surface); border-bottom: 1px solid var(--border); }
    .tab {
      flex: 1; padding: 11px; text-align: center; font-size: 13px; font-weight: 600;
      color: var(--muted); cursor: pointer; border-bottom: 2px solid transparent;
    }
    .tab.active { color: var(--accent); border-bottom-color: var(--accent); }

    .panel { display: none; flex: 1; flex-direction: column; }
    .panel.active { display: flex; }

    .scanner-wrap { position: relative; width: 100%; background: #000; overflow: hidden; height: 260px; }
    #qr-canvas-wrap, #barcode-wrap { display: none; position: relative; height: 100%; }
    #qr-canvas, #barcode-wrap video { width: 100%; height: 100%; object-fit: cover; }
    
    .viewfinder {
      position: absolute; top: 0; left: 0; right: 0; bottom: 0;
      pointer-events: none; display: flex; align-items: center; justify-content: center; z-index: 10;
    }
    .vf-box { position: relative; border: 2px solid; border-radius: 8px; box-shadow: 0 0 0 2000px rgba(0,0,0,0.5); }
    .vf-box.barcode-mode { width: 80%; height: 100px; border-color: var(--accent); }
    .vf-box.qr-mode { width: 180px; height: 180px; border-color: var(--qr-color); }
    
    .vf-line {
      position: absolute; left: 5%; width: 90%; height: 2px;
      animation: scanLine 2s ease-in-out infinite;
    }
    .vf-box.barcode-mode .vf-line { background: var(--accent); }
    .vf-box.qr-mode .vf-line { background: var(--qr-color); }
    @keyframes scanLine { 0% { top: 10%; } 100% { top: 90%; } }

    .scanner-controls { padding: 12px 20px; background: var(--surface); display: flex; flex-direction: column; gap: 10px; }
    .mode-toggle { display: flex; background: var(--card); border-radius: 10px; padding: 4px; gap: 4px; }
    .mode-btn {
      flex: 1; padding: 8px; border-radius: 7px; border: none; background: transparent;
      color: var(--muted); font-size: 12px; font-weight: 700; cursor: pointer;
    }
    .mode-btn.active-barcode { background: rgba(0,229,160,0.15); color: var(--accent); }
    .mode-btn.active-qr { background: rgba(167,139,250,0.15); color: var(--qr-color); }

    .btn-scan {
      width: 100%; padding: 13px; background: var(--accent2); color: #fff;
      border: none; border-radius: 10px; font-size: 15px; font-weight: 700; cursor: pointer;
    }
    .btn-scan.scanning { background: var(--warn); }

    .result-area { padding: 14px 20px; flex: 1; overflow-y: auto; }
    .preview-box { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 14px 16px; }
    .slot-entry { display: flex; align-items: flex-start; gap: 10px; margin-bottom: 8px; }
    .slot-tag {
      font-family: var(--mono); font-size: 10px; padding: 2px 7px; border-radius: 4px;
      background: var(--surface); border: 1px solid var(--border); flex-shrink: 0;
    }
    .tag-barcode { color: var(--accent); border-color: var(--accent); }
    .tag-qr { color: var(--qr-color); border-color: var(--qr-color); }
    .slot-val { font-family: var(--mono); font-size: 13px; word-break: break-all; }
    
    .action-row { display: flex; gap: 8px; margin-top: 12px; }
    .btn-confirm { flex: 1; padding: 12px; background: var(--accent); color: #000; border: none; border-radius: 8px; font-weight: 700; cursor: pointer; }
    .btn-confirm:disabled { opacity: 0.3; }

    .toast {
      position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%);
      padding: 10px 20px; border-radius: 20px; font-size: 13px; z-index: 1000;
      opacity: 0; transition: 0.3s; pointer-events: none;
    }
    .toast.show { opacity: 1; }
    .toast.success { background: var(--accent2); color: white; }
    
    .list-item { background: var(--card); border: 1px solid var(--border); border-radius: 12px; margin-bottom: 10px; padding: 12px; }
    .item-header { display: flex; justify-content: space-between; font-size: 11px; margin-bottom: 8px; color: var(--muted); }
  </style>
</head>
<body>

<div class="header">
  <div class="header-icon">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#000" stroke-width="2.5"><path d="M3 7V5a2 2 0 012-2h2m10 0h2a2 2 0 012 2v2m0 10v2a2 2 0 01-2 2h-2M7 21H5a2 2 0 01-2-2v-2"/></svg>
  </div>
  <h1>스마트 스캔 매니저</h1>
  <span class="header-sub" id="listCountBadge">목록 0</span>
</div>

<div class="tabs">
  <div class="tab active" onclick="switchTab('scan')">카메라 스캔</div>
  <div class="tab" onclick="switchTab('list')">저장 기록</div>
</div>

<div class="panel active" id="panel-scan">
  <div style="padding:10px 20px; background:var(--surface); display:flex; justify-content:space-between; align-items:center; border-bottom:1px solid var(--border)">
    <span style="font-size:12px; color:var(--muted)">연속 슬롯 수:</span>
    <div style="display:flex; gap:5px;">
      <button onclick="setMaxSlots(1)" id="st1" style="width:30px; height:25px; border-radius:4px; border:1px solid var(--border); background:none; color:white;">1</button>
      <button onclick="setMaxSlots(2)" id="st2" style="width:30px; height:25px; border-radius:4px; border:1px solid var(--border); background:none; color:white;">2</button>
      <button onclick="setMaxSlots(3)" id="st3" style="width:30px; height:25px; border-radius:4px; border:1px solid var(--border); background:none; color:white;">3</button>
    </div>
  </div>

  <div class="scanner-wrap">
    <div id="qr-canvas-wrap">
      <video id="qr-video" playsinline autoplay muted style="display:none;"></video>
      <canvas id="qr-canvas"></canvas>
      <div class="viewfinder"><div class="vf-box qr-mode"><div class="vf-line"></div></div></div>
    </div>
    <div id="barcode-wrap">
      <div class="viewfinder"><div class="vf-box barcode-mode"><div class="vf-line"></div></div></div>
    </div>
  </div>

  <div class="scanner-controls">
    <div class="mode-toggle">
      <button class="mode-btn active-barcode" id="modeBarcode" onclick="setMode('barcode')">바코드 모드</button>
      <button class="mode-btn" id="modeQr" onclick="setMode('qr')">QR 모드</button>
    </div>
    <button class="btn-scan" id="btnScan" onclick="toggleScanner()">카메라 시작</button>
  </div>

  <div class="result-area">
    <div class="preview-box">
      <p style="font-size:11px; color:var(--muted); margin-bottom:10px;">자동 슬롯 저장 활성화됨</p>
      <div id="currentSlotPreview"></div>
      <div class="action-row">
        <button class="btn-confirm" id="btnConfirm" onclick="confirmItem()" disabled>목록에 최종 저장</button>
        <button onclick="resetCurrent()" style="padding:10px; background:none; border:1px solid var(--border); color:var(--muted); border-radius:8px; cursor:pointer;">초기화</button>
      </div>
    </div>
  </div>
</div>

<div class="panel" id="panel-list">
  <div style="padding:15px 20px; display:flex; justify-content:space-between;">
    <h2 style="font-size:14px;">저장 내역</h2>
    <button onclick="clearAll()" style="color:var(--warn); background:none; border:none; font-size:12px;">전체 삭제</button>
  </div>
  <div id="listBody" style="padding:0 20px 20px;"></div>
</div>

<div class="toast" id="toast"></div>

<script>
  // ── State ──
  let scanning = false;
  let currentMode = 'barcode';
  let maxSlots = 2;
  let currentSlots = [null, null];
  let savedList = JSON.parse(localStorage.getItem('scannedItems') || '[]');

  // ── Init ──
  function init() {
    setMaxSlots(2);
    renderList();
    updateBadge();
  }

  function switchTab(tab) {
    document.querySelectorAll('.tab').forEach((t, i) => t.classList.toggle('active', ['scan','list'][i] === tab));
    document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
    document.getElementById('panel-' + tab).classList.add('active');
    if(tab === 'list') renderList();
  }

  function setMaxSlots(n) {
    maxSlots = n;
    currentSlots = Array(n).fill(null);
    [1,2,3].forEach(i => {
      const btn = document.getElementById('st'+i);
      if(btn) btn.style.borderColor = (i === n) ? 'var(--accent)' : 'var(--border)';
    });
    renderPreview();
  }

  function setMode(mode) {
    if(scanning) { stopAll(); }
    currentMode = mode;
    document.getElementById('modeBarcode').classList.toggle('active-barcode', mode === 'barcode');
    document.getElementById('modeQr').classList.toggle('active-qr', mode === 'qr');
  }

  function toggleScanner() {
    if(scanning) stopAll();
    else currentMode === 'qr' ? startQR() : startBarcode();
  }

  function stopAll() {
    scanning = false;
    stopQR();
    try { Quagga.stop(); } catch(e){}
    document.getElementById('barcode-wrap').style.display = 'none';
    const btn = document.getElementById('btnScan');
    btn.textContent = "카메라 시작";
    btn.classList.remove('scanning');
  }

  // ══════════════════════════════════
  //  Quagga Optimized (Barcode)
  // ══════════════════════════════════
  function startBarcode() {
    const wrap = document.getElementById('barcode-wrap');
    wrap.innerHTML = '<div class="viewfinder"><div class="vf-box barcode-mode"><div class="vf-line"></div></div></div>';
    wrap.style.display = 'block';
    document.getElementById('qr-canvas-wrap').style.display = 'none';

    Quagga.init({
      inputStream: {
        name: "Live", type: "LiveStream", target: wrap,
        constraints: { facingMode: "environment", width: 640, height: 480 }
      },
      locator: { patchSize: "medium", halfSample: true }, // 성능 패치
      decoder: { 
        readers: ["code_128_reader", "ean_reader", "ean_8_reader", "code_39_reader"],
        multiple: false 
      },
      locate: true
    }, (err) => {
      if(err) return;
      Quagga.start();
      scanning = true;
      document.getElementById('btnScan').textContent = "스캔 중지";
      document.getElementById('btnScan').classList.add('scanning');
    });

    let lastResult = "";
    let count = 0;
    Quagga.onDetected((res) => {
      let code = res.codeResult.code;
      if (code === lastResult) { // 중복 검증 (오인식 방지)
        count++;
        if (count > 2) { 
          autoSaveToSlot(code, 'barcode');
          count = 0;
          lastResult = "";
        }
      } else {
        lastResult = code;
        count = 0;
      }
    });
  }

  // ══════════════════════════════════
  //  jsQR (QR Code)
  // ══════════════════════════════════
  let qrStream, qrReq;
  async function startQR() {
    try {
      qrStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } });
      const video = document.getElementById('qr-video');
      video.srcObject = qrStream;
      await video.play();
      
      document.getElementById('qr-canvas-wrap').style.display = 'block';
      document.getElementById('barcode-wrap').style.display = 'none';
      scanning = true;
      document.getElementById('btnScan').textContent = "스캔 중지";
      document.getElementById('btnScan').classList.add('scanning');
      tickQR();
    } catch(e) {}
  }

  let qrCooldown = false;
  function tickQR() {
    if(!scanning) return;
    const video = document.getElementById('qr-video');
    const canvas = document.getElementById('qr-canvas');
    if(video.readyState === video.HAVE_ENOUGH_DATA) {
      canvas.height = video.videoHeight;
      canvas.width = video.videoWidth;
      const ctx = canvas.getContext("2d");
      ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
      const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
      const code = jsQR(imgData.data, imgData.width, imgData.height);
      
      if(code && !qrCooldown) {
        qrCooldown = true;
        autoSaveToSlot(code.data, 'qr');
        setTimeout(() => { qrCooldown = false; }, 2000); // 2초 쿨다운
      }
    }
    qrReq = requestAnimationFrame(tickQR);
  }

  function stopQR() {
    if(qrStream) qrStream.getTracks().forEach(t => t.stop());
    cancelAnimationFrame(qrReq);
    document.getElementById('qr-canvas-wrap').style.display = 'none';
  }

  // ══════════════════════════════════
  //  Auto-Save Logic
  // ══════════════════════════════════
  function autoSaveToSlot(value, type) {
    // 이미 저장된 값인지 확인
    if (currentSlots.some(s => s && s.value === value)) return;

    // 첫 번째 비어있는 슬롯 찾기
    const emptyIdx = currentSlots.findIndex(s => s === null);
    if(emptyIdx !== -1) {
      currentSlots[emptyIdx] = { value, type };
      if(navigator.vibrate) navigator.vibrate(100);
      showToast(`슬롯 ${emptyIdx + 1} 자동 저장 완료`, 'success');
      renderPreview();
    } else {
      showToast("모든 슬롯이 가득 찼습니다.", "warn");
    }
  }

  function renderPreview() {
    const wrap = document.getElementById('currentSlotPreview');
    wrap.innerHTML = currentSlots.map((s, i) => `
      <div class="slot-entry">
        <span class="slot-tag ${s ? (s.type==='qr'?'tag-qr':'tag-barcode') : ''}">슬롯 ${i+1}</span>
        <span class="slot-val">${s ? s.value : '<span style="color:var(--muted)">대기 중...</span>'}</span>
      </div>
    `).join('');
    document.getElementById('btnConfirm').disabled = !currentSlots.some(s => s !== null);
  }

  function resetCurrent() {
    currentSlots = Array(maxSlots).fill(null);
    renderPreview();
  }

  function confirmItem() {
    const newItem = {
      id: Date.now(),
      time: new Date().toLocaleString(),
      data: [...currentSlots]
    };
    savedList.unshift(newItem);
    localStorage.setItem('scannedItems', JSON.stringify(savedList));
    showToast("목록에 최종 저장되었습니다.");
    resetCurrent();
    updateBadge();
  }

  // ── List Helpers ──
  function renderList() {
    const body = document.getElementById('listBody');
    if(savedList.length === 0) {
      body.innerHTML = '<p style="text-align:center; color:var(--muted); margin-top:50px;">기록이 없습니다.</p>';
      return;
    }
    body.innerHTML = savedList.map(item => `
      <div class="list-item">
        <div class="item-header"><span>ID: ${item.id}</span><span>${item.time}</span></div>
        ${item.data.map((s, i) => s ? `<div style="font-size:12px; margin-top:4px; font-family:var(--mono)">[슬롯${i+1}] ${s.value}</div>` : '').join('')}
      </div>
    `).join('');
  }

  function clearAll() {
    if(confirm("모든 기록을 삭제하시겠습니까?")) {
      savedList = [];
      localStorage.removeItem('scannedItems');
      renderList();
      updateBadge();
    }
  }

  function updateBadge() {
    document.getElementById('listCountBadge').textContent = `목록 ${savedList.length}`;
  }

  function showToast(msg, type='success') {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.className = `toast show ${type}`;
    setTimeout(() => { t.classList.remove('show'); }, 2000);
  }

  init();
</script>
</body>
</html>
