<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>바코드 스캐너</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/quagga/0.12.1/quagga.min.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=Noto+Sans+KR:wght@300;400;700&display=swap');

    :root {
      --bg: #0d0f14;
      --surface: #161a22;
      --card: #1e2430;
      --border: #2a3040;
      --accent: #00e5a0;
      --accent2: #0077ff;
      --warn: #ff4d6d;
      --text: #e8eaf0;
      --muted: #6b7590;
      --mono: 'IBM Plex Mono', monospace;
      --sans: 'Noto Sans KR', sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--sans);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
    }

    /* Header */
    .header {
      padding: 18px 20px 14px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 12px;
      background: var(--surface);
    }
    .header-icon {
      width: 36px; height: 36px;
      background: var(--accent);
      border-radius: 8px;
      display: flex; align-items: center; justify-content: center;
    }
    .header-icon svg { width: 20px; height: 20px; }
    .header h1 {
      font-size: 18px;
      font-weight: 700;
      letter-spacing: -0.3px;
    }
    .header span {
      font-size: 11px;
      color: var(--muted);
      font-family: var(--mono);
      margin-left: auto;
    }

    /* Tabs */
    .tabs {
      display: flex;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
    }
    .tab {
      flex: 1;
      padding: 12px;
      text-align: center;
      font-size: 13px;
      font-weight: 600;
      color: var(--muted);
      cursor: pointer;
      border-bottom: 2px solid transparent;
      transition: all 0.2s;
      user-select: none;
    }
    .tab.active {
      color: var(--accent);
      border-bottom-color: var(--accent);
    }

    /* Panels */
    .panel { display: none; flex: 1; flex-direction: column; }
    .panel.active { display: flex; }

    /* Scanner Panel */
    .scanner-wrap {
      position: relative;
      width: 100%;
      background: #000;
      overflow: hidden;
    }
    #scanner-container {
      width: 100%;
      position: relative;
    }
    #scanner-container video {
      width: 100%;
      display: block;
    }
    #scanner-container canvas.drawingBuffer {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
    }

    /* Viewfinder overlay */
    .viewfinder {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      pointer-events: none;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .vf-box {
      width: 72%;
      aspect-ratio: 2.5/1;
      border: 2px solid var(--accent);
      border-radius: 6px;
      box-shadow: 0 0 0 2000px rgba(0,0,0,0.45);
      position: relative;
    }
    .vf-line {
      position: absolute;
      top: 50%; left: 5%;
      width: 90%; height: 2px;
      background: linear-gradient(90deg, transparent, var(--accent), transparent);
      animation: scanLine 1.8s ease-in-out infinite;
    }
    @keyframes scanLine {
      0% { top: 15%; opacity: 0.3; }
      50% { opacity: 1; }
      100% { top: 85%; opacity: 0.3; }
    }
    .vf-corner {
      position: absolute;
      width: 14px; height: 14px;
      border-color: var(--accent);
      border-style: solid;
    }
    .vf-corner.tl { top: -2px; left: -2px; border-width: 3px 0 0 3px; border-radius: 3px 0 0 0; }
    .vf-corner.tr { top: -2px; right: -2px; border-width: 3px 3px 0 0; border-radius: 0 3px 0 0; }
    .vf-corner.bl { bottom: -2px; left: -2px; border-width: 0 0 3px 3px; border-radius: 0 0 0 3px; }
    .vf-corner.br { bottom: -2px; right: -2px; border-width: 0 3px 3px 0; border-radius: 0 0 3px 0; }

    /* Scanner controls */
    .scanner-controls {
      padding: 16px 20px;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
    }
    .btn-scan {
      width: 100%;
      padding: 14px;
      background: var(--accent);
      color: #000;
      border: none;
      border-radius: 10px;
      font-size: 15px;
      font-weight: 700;
      font-family: var(--sans);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: opacity 0.2s, transform 0.1s;
    }
    .btn-scan:active { transform: scale(0.98); opacity: 0.85; }
    .btn-scan.scanning {
      background: var(--warn);
    }
    .btn-scan svg { width: 18px; height: 18px; flex-shrink: 0; }

    /* Result area */
    .result-area {
      padding: 14px 20px;
      flex: 1;
      overflow-y: auto;
    }

    /* Detected result */
    .detected-box {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px 16px;
      margin-bottom: 16px;
    }
    .detected-label {
      font-size: 10px;
      font-family: var(--mono);
      color: var(--accent);
      letter-spacing: 1px;
      text-transform: uppercase;
      margin-bottom: 6px;
    }
    .detected-value {
      font-family: var(--mono);
      font-size: 17px;
      color: var(--text);
      word-break: break-all;
      margin-bottom: 10px;
    }
    .detected-value.empty { color: var(--muted); font-size: 13px; }

    /* Slot selector */
    .slot-label {
      font-size: 12px;
      color: var(--muted);
      margin-bottom: 8px;
    }
    .slot-row {
      display: flex;
      gap: 8px;
      margin-bottom: 12px;
      flex-wrap: wrap;
    }
    .slot-btn {
      flex: 1;
      min-width: 0;
      padding: 8px 4px;
      border-radius: 8px;
      border: 1.5px solid var(--border);
      background: var(--surface);
      color: var(--muted);
      font-size: 12px;
      font-family: var(--mono);
      cursor: pointer;
      transition: all 0.15s;
      text-align: center;
    }
    .slot-btn.selected {
      border-color: var(--accent2);
      color: var(--accent2);
      background: rgba(0,119,255,0.08);
    }
    .slot-btn.filled { border-color: var(--accent); color: var(--accent); }
    .slot-btn.selected.filled {
      border-color: var(--accent2);
      color: var(--accent2);
      background: rgba(0,119,255,0.12);
    }

    .btn-save {
      width: 100%;
      padding: 12px;
      background: transparent;
      border: 1.5px solid var(--accent2);
      color: var(--accent2);
      border-radius: 10px;
      font-size: 14px;
      font-weight: 700;
      font-family: var(--sans);
      cursor: pointer;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
    .btn-save:active { background: rgba(0,119,255,0.1); }
    .btn-save:disabled { opacity: 0.3; cursor: not-allowed; }
    .btn-save svg { width: 16px; height: 16px; }

    /* Toast */
    .toast {
      position: fixed;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%) translateY(20px);
      background: var(--accent);
      color: #000;
      padding: 10px 22px;
      border-radius: 30px;
      font-size: 13px;
      font-weight: 700;
      opacity: 0;
      transition: all 0.3s;
      z-index: 999;
      white-space: nowrap;
    }
    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    /* List Panel */
    .list-header {
      padding: 16px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--border);
    }
    .list-header h2 { font-size: 14px; font-weight: 700; }
    .list-count {
      font-family: var(--mono);
      font-size: 12px;
      color: var(--muted);
    }
    .btn-clear-all {
      font-size: 12px;
      color: var(--warn);
      background: none;
      border: none;
      cursor: pointer;
      font-family: var(--sans);
      padding: 4px 0;
    }

    .list-body {
      flex: 1;
      overflow-y: auto;
      padding: 12px 20px 20px;
    }

    .empty-state {
      text-align: center;
      padding: 60px 20px;
      color: var(--muted);
    }
    .empty-state svg { width: 40px; height: 40px; margin-bottom: 12px; opacity: 0.3; }
    .empty-state p { font-size: 14px; }

    /* List item */
    .list-item {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      margin-bottom: 10px;
      overflow: hidden;
      animation: fadeIn 0.25s ease;
    }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

    .item-header {
      padding: 10px 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--border);
    }
    .item-num {
      font-family: var(--mono);
      font-size: 11px;
      color: var(--accent);
      font-weight: 600;
    }
    .item-time {
      font-size: 10px;
      font-family: var(--mono);
      color: var(--muted);
    }
    .btn-delete-item {
      background: none;
      border: none;
      cursor: pointer;
      color: var(--muted);
      padding: 2px;
      line-height: 0;
      transition: color 0.2s;
    }
    .btn-delete-item:active { color: var(--warn); }
    .btn-delete-item svg { width: 14px; height: 14px; }

    .slot-list {
      padding: 10px 14px 12px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .slot-entry {
      display: flex;
      align-items: flex-start;
      gap: 10px;
    }
    .slot-tag {
      font-family: var(--mono);
      font-size: 10px;
      color: var(--muted);
      background: var(--surface);
      border: 1px solid var(--border);
      padding: 2px 7px;
      border-radius: 4px;
      flex-shrink: 0;
      margin-top: 1px;
    }
    .slot-val {
      font-family: var(--mono);
      font-size: 13px;
      color: var(--text);
      word-break: break-all;
      flex: 1;
    }
    .slot-val.empty-slot { color: var(--muted); font-size: 12px; font-style: italic; }

    /* slots per item config */
    .config-bar {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 10px 20px;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .config-bar label {
      font-size: 12px;
      color: var(--muted);
      flex-shrink: 0;
    }
    .slots-toggle {
      display: flex;
      gap: 6px;
    }
    .stoggle {
      width: 34px;
      height: 30px;
      border-radius: 6px;
      border: 1.5px solid var(--border);
      background: var(--card);
      color: var(--muted);
      font-size: 13px;
      font-weight: 700;
      font-family: var(--mono);
      cursor: pointer;
      transition: all 0.15s;
    }
    .stoggle.active {
      border-color: var(--accent);
      color: var(--accent);
      background: rgba(0,229,160,0.08);
    }
  </style>
</head>
<body>

<div class="header">
  <div class="header-icon">
    <svg viewBox="0 0 24 24" fill="none" stroke="#000" stroke-width="2.5" stroke-linecap="round">
      <rect x="2" y="6" width="3" height="12"/><rect x="7" y="6" width="1.5" height="12"/>
      <rect x="10.5" y="6" width="3" height="12"/><rect x="15.5" y="6" width="1.5" height="12"/>
      <rect x="19" y="6" width="3" height="12"/>
    </svg>
  </div>
  <h1>바코드 스캐너</h1>
  <span id="listCountBadge">목록 0개</span>
</div>

<div class="tabs">
  <div class="tab active" onclick="switchTab('scan')">📷 스캔</div>
  <div class="tab" onclick="switchTab('list')">📋 목록</div>
</div>

<!-- SCAN PANEL -->
<div class="panel active" id="panel-scan">

  <div class="config-bar">
    <label>슬롯 수</label>
    <div class="slots-toggle">
      <button class="stoggle" onclick="setMaxSlots(1)" id="st1">1</button>
      <button class="stoggle active" onclick="setMaxSlots(2)" id="st2">2</button>
      <button class="stoggle" onclick="setMaxSlots(3)" id="st3">3</button>
    </div>
    <span style="font-size:11px;color:var(--muted);margin-left:4px">항목당 바코드 수</span>
  </div>

  <div class="scanner-wrap">
    <div id="scanner-container">
      <div class="viewfinder" id="viewfinder" style="display:none">
        <div class="vf-box">
          <div class="vf-line"></div>
          <div class="vf-corner tl"></div><div class="vf-corner tr"></div>
          <div class="vf-corner bl"></div><div class="vf-corner br"></div>
        </div>
      </div>
    </div>
  </div>

  <div class="scanner-controls">
    <button class="btn-scan" id="btnScan" onclick="toggleScanner()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round">
        <path d="M3 7V5a2 2 0 012-2h2M17 3h2a2 2 0 012 2v2M21 17v2a2 2 0 01-2 2h-2M7 21H5a2 2 0 01-2-2v-2"/>
        <line x1="7" y1="12" x2="17" y2="12"/>
      </svg>
      카메라 시작
    </button>
  </div>

  <div class="result-area">
    <div class="detected-box">
      <div class="detected-label">감지된 바코드</div>
      <div class="detected-value empty" id="detectedVal">스캔 대기 중...</div>

      <div id="slotSection" style="display:none">
        <div class="slot-label">저장할 슬롯 선택</div>
        <div class="slot-row" id="slotRow"></div>
        <button class="btn-save" id="btnSave" onclick="saveToSlot()" disabled>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round">
            <path d="M19 21H5a2 2 0 01-2-2V5a2 2 0 012-2h11l5 5v13a2 2 0 01-2 2z"/>
            <polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/>
          </svg>
          슬롯에 저장
        </button>
      </div>
    </div>

    <!-- Current working item preview -->
    <div class="detected-box" id="currentItemBox">
      <div class="detected-label">현재 항목 미리보기</div>
      <div id="currentSlotPreview" style="display:flex;flex-direction:column;gap:6px;margin-bottom:10px"></div>
      <div style="display:flex;gap:8px;">
        <button onclick="confirmItem()" id="btnConfirm" style="flex:1;padding:11px;background:var(--accent2);color:#fff;border:none;border-radius:9px;font-size:13px;font-weight:700;font-family:var(--sans);cursor:pointer;" disabled>
          ✅ 목록에 추가
        </button>
        <button onclick="resetCurrent()" style="padding:11px 14px;background:transparent;border:1.5px solid var(--border);color:var(--muted);border-radius:9px;font-size:13px;cursor:pointer;font-family:var(--sans);">
          🗑 초기화
        </button>
      </div>
    </div>
  </div>
</div>

<!-- LIST PANEL -->
<div class="panel" id="panel-list">
  <div class="list-header">
    <h2>저장된 목록</h2>
    <div style="display:flex;gap:12px;align-items:center">
      <span class="list-count" id="listCountText">0개</span>
      <button class="btn-clear-all" onclick="clearAll()">전체 삭제</button>
    </div>
  </div>
  <div class="list-body" id="listBody">
    <div class="empty-state">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="2" y="6" width="3" height="12"/><rect x="7" y="6" width="1.5" height="12"/><rect x="10.5" y="6" width="3" height="12"/><rect x="15.5" y="6" width="1.5" height="12"/><rect x="19" y="6" width="3" height="12"/></svg>
      <p>저장된 항목이 없습니다.<br>바코드를 스캔해서 추가하세요.</p>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
  let scanning = false;
  let lastCode = null;
  let maxSlots = 2;
  let selectedSlot = 0;
  let currentSlots = [];   // current working item slots
  let savedList = JSON.parse(localStorage.getItem('barcodeList') || '[]');

  // ─── Init ───
  function init() {
    resetCurrent();
    renderList();
    updateBadge();
  }

  // ─── Tab ───
  function switchTab(tab) {
    document.querySelectorAll('.tab').forEach((t, i) => t.classList.toggle('active', ['scan','list'][i] === tab));
    document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
    document.getElementById('panel-' + tab).classList.add('active');
    if (tab === 'list') renderList();
  }

  // ─── Slot config ───
  function setMaxSlots(n) {
    maxSlots = n;
    [1,2,3].forEach(i => document.getElementById('st'+i).classList.toggle('active', i === n));
    resetCurrent();
  }

  // ─── Scanner ───
  function toggleScanner() {
    if (scanning) stopScanner();
    else startScanner();
  }

  function startScanner() {
    document.getElementById('viewfinder').style.display = 'flex';
    const btn = document.getElementById('btnScan');
    btn.classList.add('scanning');
    btn.innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><rect x="3" y="3" width="18" height="18" rx="2"/><line x1="9" y1="9" x2="15" y2="15"/><line x1="15" y1="9" x2="9" y2="15"/></svg> 스캔 중지`;

    Quagga.init({
      inputStream: {
        name: 'Live',
        type: 'LiveStream',
        target: document.getElementById('scanner-container'),
        constraints: {
          facingMode: 'environment',
          width: { ideal: 1280 },
          height: { ideal: 720 }
        }
      },
      decoder: {
        readers: [
          'ean_reader','ean_8_reader','code_128_reader',
          'code_39_reader','upc_reader','upc_e_reader',
          'codabar_reader','i2of5_reader'
        ]
      },
      locate: true
    }, err => {
      if (err) { showToast('카메라 오류: ' + err.message); stopScanner(); return; }
      Quagga.start();
      scanning = true;
    });

    Quagga.onDetected(onDetected);
  }

  function stopScanner() {
    Quagga.offDetected(onDetected);
    Quagga.stop();
    scanning = false;
    document.getElementById('viewfinder').style.display = 'none';
    const btn = document.getElementById('btnScan');
    btn.classList.remove('scanning');
    btn.innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M3 7V5a2 2 0 012-2h2M17 3h2a2 2 0 012 2v2M21 17v2a2 2 0 01-2 2h-2M7 21H5a2 2 0 01-2-2v-2"/><line x1="7" y1="12" x2="17" y2="12"/></svg> 카메라 시작`;
  }

  let detectCooldown = false;
  function onDetected(result) {
    if (detectCooldown) return;
    const code = result.codeResult.code;
    if (!code) return;
    detectCooldown = true;
    setTimeout(() => detectCooldown = false, 1200);

    lastCode = code;
    document.getElementById('detectedVal').textContent = code;
    document.getElementById('detectedVal').classList.remove('empty');
    document.getElementById('slotSection').style.display = 'block';
    document.getElementById('btnSave').disabled = false;

    // vibrate
    if (navigator.vibrate) navigator.vibrate(80);
  }

  // ─── Slot management ───
  function resetCurrent() {
    currentSlots = Array(maxSlots).fill(null);
    selectedSlot = 0;
    lastCode = null;
    document.getElementById('detectedVal').textContent = '스캔 대기 중...';
    document.getElementById('detectedVal').classList.add('empty');
    document.getElementById('slotSection').style.display = 'none';
    document.getElementById('btnSave').disabled = true;
    renderSlotBtns();
    renderPreview();
  }

  function renderSlotBtns() {
    const row = document.getElementById('slotRow');
    row.innerHTML = '';
    for (let i = 0; i < maxSlots; i++) {
      const btn = document.createElement('button');
      btn.className = 'slot-btn' + (i === selectedSlot ? ' selected' : '') + (currentSlots[i] ? ' filled' : '');
      btn.textContent = `슬롯 ${i+1}` + (currentSlots[i] ? ` ✓` : '');
      btn.onclick = () => { selectedSlot = i; renderSlotBtns(); };
      row.appendChild(btn);
    }
  }

  function saveToSlot() {
    if (!lastCode) return;
    currentSlots[selectedSlot] = lastCode;
    showToast(`슬롯 ${selectedSlot+1}에 저장됨`);
    lastCode = null;
    document.getElementById('detectedVal').textContent = '다음 바코드 스캔 대기...';
    document.getElementById('detectedVal').classList.add('empty');
    document.getElementById('slotSection').style.display = 'none';
    document.getElementById('btnSave').disabled = true;

    // auto-move to next empty slot
    const nextEmpty = currentSlots.findIndex(s => s === null);
    if (nextEmpty !== -1) selectedSlot = nextEmpty;

    renderSlotBtns();
    renderPreview();
  }

  function renderPreview() {
    const wrap = document.getElementById('currentSlotPreview');
    wrap.innerHTML = '';
    for (let i = 0; i < maxSlots; i++) {
      const row = document.createElement('div');
      row.className = 'slot-entry';
      row.innerHTML = `<span class="slot-tag">슬롯${i+1}</span><span class="slot-val${currentSlots[i] ? '' : ' empty-slot'}">${currentSlots[i] || '비어있음'}</span>`;
      wrap.appendChild(row);
    }
    const hasAny = currentSlots.some(s => s !== null);
    document.getElementById('btnConfirm').disabled = !hasAny;
  }

  // ─── Confirm item ───
  function confirmItem() {
    const item = {
      id: Date.now(),
      time: new Date().toLocaleString('ko-KR'),
      slots: [...currentSlots]
    };
    savedList.unshift(item);
    localStorage.setItem('barcodeList', JSON.stringify(savedList));
    showToast('목록에 추가됐습니다!');
    resetCurrent();
    updateBadge();
    renderList();
  }

  // ─── List ───
  function renderList() {
    const body = document.getElementById('listBody');
    if (savedList.length === 0) {
      body.innerHTML = `<div class="empty-state"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="2" y="6" width="3" height="12"/><rect x="7" y="6" width="1.5" height="12"/><rect x="10.5" y="6" width="3" height="12"/><rect x="15.5" y="6" width="1.5" height="12"/><rect x="19" y="6" width="3" height="12"/></svg><p>저장된 항목이 없습니다.<br>바코드를 스캔해서 추가하세요.</p></div>`;
      return;
    }
    body.innerHTML = savedList.map((item, idx) => `
      <div class="list-item">
        <div class="item-header">
          <span class="item-num">#${String(savedList.length - idx).padStart(3,'0')}</span>
          <span class="item-time">${item.time}</span>
          <button class="btn-delete-item" onclick="deleteItem(${item.id})">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14H6L5 6"/><path d="M10 11v6M14 11v6"/></svg>
          </button>
        </div>
        <div class="slot-list">
          ${item.slots.map((s, i) => `
            <div class="slot-entry">
              <span class="slot-tag">슬롯${i+1}</span>
              <span class="slot-val${s ? '' : ' empty-slot'}">${s || '(비어있음)'}</span>
            </div>`).join('')}
        </div>
      </div>`).join('');

    document.getElementById('listCountText').textContent = `${savedList.length}개`;
  }

  function deleteItem(id) {
    savedList = savedList.filter(i => i.id !== id);
    localStorage.setItem('barcodeList', JSON.stringify(savedList));
    renderList();
    updateBadge();
    showToast('삭제됐습니다');
  }

  function clearAll() {
    if (!confirm('모든 항목을 삭제하시겠습니까?')) return;
    savedList = [];
    localStorage.setItem('barcodeList', JSON.stringify(savedList));
    renderList();
    updateBadge();
    showToast('전체 삭제 완료');
  }

  function updateBadge() {
    document.getElementById('listCountBadge').textContent = `목록 ${savedList.length}개`;
  }

  // ─── Toast ───
  let toastTimer;
  function showToast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => t.classList.remove('show'), 2200);
  }

  init();
</script>
</body>
</html>
